<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Cileungsi Sekitar</title>
<link rel="icon" href="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png">
<style>
body{margin:0;background:#07101e;color:#edf5ff;font:15px Arial,sans-serif}main{max-width:820px;margin:auto;padding:35px 20px}.logo{display:flex;align-items:center;gap:10px;font-weight:bold}.logo img{width:40px;height:40px;object-fit:contain;border-radius:8px}h1{font-size:34px;margin-bottom:5px}p{color:#9eafc9;line-height:1.55}.box{background:#101c31;border:1px solid #2a3d5d;border-radius:14px;padding:22px;margin:18px 0}label{display:block;font-size:13px;font-weight:bold;margin:14px 0}input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:11px;background:#07101e;color:white;border:1px solid #33496e;border-radius:8px;font:inherit}input[type=file]{padding:8px}textarea{min-height:145px}button{padding:10px 13px;border-radius:8px;border:1px solid #3b537a;background:#16263f;color:white;font-weight:bold;cursor:pointer}.primary{background:#39e7ff;color:#03101b;border:0}.hide{display:none}.item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #2a3d5d}.item strong{flex:1}.item button{font-size:12px;color:#ffb0bd;background:transparent;border:0}.ok{color:#bfff7a}.err{color:#ff9eae}small{display:block;margin-top:5px;color:#9eafc9;font-size:12px;font-weight:normal;line-height:1.45}
</style>
</head>
<body>
<main>
<div class="logo"><img src="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png" alt="Logo"> CILEUNGSI SEKITAR / PANEL MASTER</div>
<h1>Kelola berita</h1>
<p>Lindungi halaman ini melalui Cloudflare Access. Token GitHub hanya dipakai selama halaman terbuka dan tidak disimpan.</p>
<section id="login" class="box">
<label>GitHub fine-grained token<input id="token" type="password" placeholder="github_pat_..."></label>
<button id="connect" type="button" class="primary">Hubungkan GitHub</button>
<p id="loginMsg"></p>
</section>
<section id="app" class="hide">
<section class="box">
<h2 id="formTitle">Terbitkan berita</h2>
<form id="form">
<label>Headline<input id="headline" required></label>
<label>URL gambar langsung<small>Opsional. Isi jika sudah memiliki URL gambar JPG, PNG, WebP, atau GIF.</small><input id="image" type="url" placeholder="https://contoh.com/foto.jpg"></label>
<label>Atau upload gambar dari perangkat<small>Opsional. Jika URL dan file diisi, file upload yang dipakai. Maksimal 5 MB.</small><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
<label>Artikel<textarea id="article" required></textarea></label>
<button class="primary">Terbitkan ke GitHub</button>
<button id="cancel" type="button">Batal</button>
</form>
<p id="msg"></p>
</section>
<section class="box"><h2>Berita tersimpan</h2><div id="list"></div></section>
</section>
</main>
<script>
const OWNER='ebonispace-hue';
const REPO='sekitar';
const FILE='berita.json';
const BRANCH='main';
const DEFAULT_IMAGE='https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png';
const api='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE;
let token='',sha='',news=[],editId=null;
const $=function(s){return document.querySelector(s)};
const loginBox=$('#login'),appBox=$('#app'),loginMsg=$('#loginMsg'),form=$('#form'),headline=$('#headline'),image=$('#image'),imageFile=$('#imageFile'),article=$('#article'),formTitle=$('#formTitle'),msg=$('#msg'),list=$('#list'),connect=$('#connect'),cancel=$('#cancel');
function head(){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}}
function encodeJson(data){return btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)+'\n')))}
async function load(){let r=await fetch(api+'?ref='+BRANCH,{headers:head()});if(!r.ok)throw Error('Akses ditolak ('+r.status+'). Token perlu izin Contents: Read and write untuk repository ini.');let d=await r.json();sha=d.sha;news=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));draw()}
function draw(){list.innerHTML=news.map(function(x){return '<div class="item"><strong>'+x.headline+'</strong><button data-e="'+x.id+'">Edit</button><button data-d="'+x.id+'">Hapus</button></div>'}).join('')||'Belum ada berita.';document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){let x=news.find(function(n){return n.id===b.dataset.e});if(!x)return;editId=x.id;headline.value=x.headline;image.value=x.image||'';imageFile.value='';article.value=x.article;formTitle.textContent='Edit berita'}});document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Hapus berita ini?')){news=news.filter(function(n){return n.id!==b.dataset.d});save('Hapus berita')}}})}
async function save(message){msg.className='';msg.textContent='Menyimpan berita…';let r=await fetch(api,{method:'PUT',headers:Object.assign({},head(),{'Content-Type':'application/json'}),body:JSON.stringify({message:message,content:encodeJson(news),sha:sha,branch:BRANCH})});if(!r.ok){let e=await r.json().catch(function(){return{}});msg.className='err';msg.textContent='Gagal menyimpan: '+(e.message||'HTTP '+r.status);return false}sha=(await r.json()).content.sha;msg.className='ok';msg.textContent='Berhasil. Homepage akan diperbarui otomatis oleh Cloudflare Pages.';form.reset();editId=null;formTitle.textContent='Terbitkan berita';draw();return true}
function fileToBase64(file){return new Promise(function(resolve,reject){let reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1])};reader.onerror=function(){reject(Error('File gambar tidak dapat dibaca.'))};reader.readAsDataURL(file)})}
async function uploadImage(file){let types=['image/jpeg','image/png','image/webp','image/gif'];if(types.indexOf(file.type)===-1)throw Error('Gunakan gambar JPG, PNG, WebP, atau GIF.');if(file.size>5*1024*1024)throw Error('Ukuran gambar maksimal 5 MB.');let ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';let clean=(headline.value.trim()||'berita').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,55)||'berita';let filename=Date.now()+'-'+clean+'.'+ext;let path='assets/images/'+filename;let fileApi='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/assets/images/'+encodeURIComponent(filename);let r=await fetch(fileApi,{method:'PUT',headers:Object.assign({},head(),{'Content-Type':'application/json'}),body:JSON.stringify({message:'Upload gambar berita: '+clean,content:await fileToBase64(file),branch:BRANCH})});if(!r.ok){let e=await r.json().catch(function(){return{}});throw Error(e.message||'HTTP '+r.status)}return path}
connect.onclick=async function(){token=$('#token').value.trim();if(!token){loginMsg.className='err';loginMsg.textContent='Masukkan GitHub fine-grained token terlebih dahulu.';return}connect.disabled=true;connect.textContent='Menghubungkan…';loginMsg.className='';loginMsg.textContent='Memeriksa akses GitHub…';try{await load();loginBox.classList.add('hide');appBox.classList.remove('hide')}catch(e){loginMsg.className='err';loginMsg.textContent=e.message||'Login gagal.'}finally{connect.disabled=false;connect.textContent='Hubungkan GitHub'}};
form.onsubmit=async function(e){e.preventDefault();try{let oldItem=news.find(function(n){return n.id===editId});let imageUrl=image.value.trim();let selected=imageFile.files[0];if(selected){msg.className='';msg.textContent='Mengunggah gambar ke GitHub…';imageUrl=await uploadImage(selected)}if(!imageUrl)imageUrl=(oldItem&&oldItem.image)||DEFAULT_IMAGE;let item={id:editId||Date.now()+'',headline:headline.value.trim(),image:imageUrl,article:article.value.trim(),publishedAt:(oldItem&&oldItem.publishedAt)||new Date().toISOString()};news=editId?news.map(function(n){return n.id===editId?item:n}):[item].concat(news);await save(editId?'Perbarui berita':'Terbitkan berita')}catch(err){msg.className='err';msg.textContent='Gagal upload gambar: '+err.message}};
cancel.onclick=function(){form.reset();editId=null;formTitle.textContent='Terbitkan berita';msg.textContent=''};
</script>
</body>
</html>
