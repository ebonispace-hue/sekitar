<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Cileungsi Sekitar</title><link rel="icon" href="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png"><style>body{margin:0;background:#07101e;color:#edf5ff;font:15px Arial,sans-serif}main{max-width:820px;margin:auto;padding:35px 20px}.logo{display:flex;align-items:center;gap:10px;font-weight:bold}.logo img{width:40px;height:40px;object-fit:contain;border-radius:8px}h1{font-size:34px;margin-bottom:5px}p{color:#9eafc9;line-height:1.55}.box{background:#101c31;border:1px solid #2a3d5d;border-radius:14px;padding:22px;margin:18px 0}label{display:block;font-size:13px;font-weight:bold;margin:14px 0}input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:11px;background:#07101e;color:white;border:1px solid #33496e;border-radius:8px;font:inherit}textarea{min-height:145px}button{padding:10px 13px;border-radius:8px;border:1px solid #3b537a;background:#16263f;color:white;font-weight:bold;cursor:pointer}.primary{background:#39e7ff;color:#03101b;border:0}.hide{display:none}.item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #2a3d5d}.item strong{flex:1}.item button{font-size:12px;color:#ffb0bd;background:transparent;border:0}.ok{color:#bfff7a}.err{color:#ff9eae}.note{font-size:13px;background:#132743;padding:12px;border-radius:8px;color:#cbdaf0}</style></head><body><main><div class="logo"><img src="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png"> CILEUNGSI SEKITAR / PANEL MASTER</div><h1>Kelola berita</h1><p>Lindungi halaman ini melalui Cloudflare Access. Token GitHub hanya dipakai selama halaman terbuka dan tidak disimpan.</p><section id="login" class="box"><label>GitHub fine-grained token<input id="token" type="password" placeholder="github_pat_..."></label><button id="connect" class="primary">Hubungkan GitHub</button><p id="loginMsg"></p></section><section id="app" class="hide"><section class="box"><h2 id="formTitle">Terbitkan berita</h2><form id="form"><label>Headline<input id="headline" required></label><label>URL gambar<input id="image" type="url" required></label><label>Artikel<textarea id="article" required></textarea></label><button class="primary">Terbitkan ke GitHub</button><button id="cancel" type="button">Batal</button></form><p id="msg"></p></section><section class="box"><h2>Berita tersimpan</h2><div id="list"></div></section></section></main><script>const OWNER='ebonispace-hue',REPO='sekitar',FILE='berita.json',BRANCH='main',api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;let token='',sha='',news=[],editId=null;const $=s=>document.querySelector(s);function head(){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}}async function load(){let r=await fetch(api+'?ref='+BRANCH,{headers:head()});if(!r.ok)throw Error('Akses ditolak ('+r.status+'). Token perlu izin Contents: Read and write untuk repository ini.');let d=await r.json();sha=d.sha;news=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));draw()}function draw(){list.innerHTML=news.map(x=>`<div class="item"><strong>${x.headline}</strong><button data-e="${x.id}">Edit</button><button data-d="${x.id}">Hapus</button></div>`).join('')||'Belum ada berita.';document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let x=news.find(n=>n.id===b.dataset.e);editId=x.id;headline.value=x.headline;image.value=x.image;article.value=x.article;formTitle.textContent='Edit berita'});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Hapus?')){news=news.filter(n=>n.id!==b.dataset.d);save('Hapus berita')}})}async function save(message){msg.textContent='Menyimpan…';let content=btoa(unescape(encodeURIComponent(JSON.stringify(news,null,2)+'\n')));let r=await fetch(api,{method:'PUT',headers:{...head(),'Content-Type':'application/json'},body:JSON.stringify({message,content,sha,branch:BRANCH})});if(!r.ok){msg.className='err';msg.textContent='Gagal menyimpan.';return}sha=(await r.json()).content.sha;msg.className='ok';msg.textContent='Berhasil. Homepage akan diperbarui otomatis oleh Cloudflare Pages.';form.reset();editId=null;formTitle.textContent='Terbitkan berita';draw()}connect.onclick=async()=>{token=$('#token').value.trim();try{await load();login.classList.add('hide');app.classList.remove('hide')}catch(e){loginMsg.className='err';loginMsg.textContent=e.message}};form.onsubmit=e=>{e.preventDefault();let x={id:editId||Date.now()+'',headline:headline.value.trim(),image:image.value.trim(),article:article.value.trim(),publishedAt:new Date().toISOString()};news=editId?news.map(n=>n.id===editId?x:n):[x,...news];save(editId?'Perbarui berita':'Terbitkan berita')};cancel.onclick=()=>{form.reset();editId=null;formTitle.textContent='Terbitkan berita'}</script></body></html>
