<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Master Cileungsi Sekitar</title>
  <link rel="icon" href="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png">
  <style>
    body{margin:0;background:#07101e;color:#edf5ff;font:15px Arial,sans-serif}
    main{max-width:820px;margin:auto;padding:35px 20px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:bold}
    .logo img{width:40px;height:40px;object-fit:contain;border-radius:8px}
    h1{font-size:34px;margin-bottom:5px}
    p{color:#9eafc9;line-height:1.55}
    .box{background:#101c31;border:1px solid #2a3d5d;border-radius:14px;padding:22px;margin:18px 0}
    label{display:block;font-size:13px;font-weight:bold;margin:14px 0}
    input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:11px;background:#07101e;color:white;border:1px solid #33496e;border-radius:8px;font:inherit}
    input[type=file]{padding:8px}
    textarea{min-height:145px}
    button{padding:10px 13px;border-radius:8px;border:1px solid #3b537a;background:#16263f;color:white;font-weight:bold;cursor:pointer}
    .primary{background:#39e7ff;color:#03101b;border:0}
    .hide{display:none}
    .item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #2a3d5d}
    .item strong{flex:1}
    .item button{font-size:12px;color:#ffb0bd;background:transparent;border:0}
    .ok{color:#bfff7a}
    .err{color:#ff9eae}
    small{display:block;margin-top:5px;color:#9eafc9;font-size:12px;font-weight:normal;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <img src="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png" alt="Logo">
      CILEUNGSI SEKITAR / PANEL MASTER
    </div>

    <h1>Kelola berita</h1>
    <p>Lindungi halaman ini melalui Cloudflare Access. Token GitHub hanya dipakai selama halaman terbuka dan tidak disimpan.</p>

    <section id="login" class="box">
      <label>
        GitHub fine-grained token
        <input id="token" type="password" placeholder="github_pat_...">
      </label>
      <button id="connect" class="primary">Hubungkan GitHub</button>
      <p id="loginMsg"></p>
    </section>

    <section id="app" class="hide">
      <section class="box">
        <h2 id="formTitle">Terbitkan berita</h2>

        <form id="form">
          <label>
            Headline
            <input id="headline" required>
          </label>

          <label>
            URL gambar langsung
            <small>Opsional. Masukkan URL file gambar seperti JPG, PNG, WebP, atau GIF.</small>
            <input id="image" type="url" placeholder="https://res.cloudinary.com/.../foto.jpg">
          </label>

          <label>
            Atau upload gambar dari perangkat
            <small>Opsional. Jika URL dan file diisi, file upload akan dipakai. Maksimal 5 MB.</small>
            <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          </label>

          <label>
            Artikel
            <textarea id="article" required></textarea>
          </label>

          <button class="primary">Terbitkan ke GitHub</button>
          <button id="cancel" type="button">Batal</button>
        </form>

        <p id="msg"></p>
      </section>

      <section class="box">
        <h2>Berita tersimpan</h2>
        <div id="list"></div>
      </section>
    </section>
  </main>

  <script>
    const OWNER='ebonispace-hue';
    const REPO='sekitar';
    const FILE='berita.json';
    const BRANCH='main';
    const DEFAULT_IMAGE='https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png';
    const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

    let token='';
    let sha='';
    let news=[];
    let editId=null;

    const $=selector=>document.querySelector(selector);
    const login=$('#login');
    const app=$('#app');
    const loginMsg=$('#loginMsg');
    const form=$('#form');
    const formTitle=$('#formTitle');
    const headline=$('#headline');
    const imageInput=$('#image');
    const imageFileInput=$('#imageFile');
    const article=$('#article');
    const msg=$('#msg');
    const list=$('#list');
    const connect=$('#connect');
    const cancel=$('#cancel');

    function head(){
      return {
        Authorization:'Bearer '+token,
        Accept:'application/vnd.github+json'
      };
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>'"]/g,char=>({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'
      }[char]));
    }

    function encodeJson(data){
      return btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)+'\n')));
    }

    async function load(){
      const response=await fetch(api+'?ref='+BRANCH,{headers:head()});

      if(!response.ok){
        throw Error('Akses ditolak ('+response.status+'). Token perlu izin Contents: Read and write untuk repository ini.');
      }

      const data=await response.json();
      sha=data.sha;
      news=JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
      draw();
    }

    function draw(){
      list.innerHTML=news.map(item=>`
        <div class="item">
          <strong>${escapeHtml(item.headline)}</strong>
          <button data-e="${escapeHtml(item.id)}">Edit</button>
          <button data-d="${escapeHtml(item.id)}">Hapus</button>
        </div>
      `).join('') || 'Belum ada berita.';

      document.querySelectorAll('[data-e]').forEach(button=>{
        button.onclick=()=>{
          const item=news.find(entry=>entry.id===button.dataset.e);
          if(!item)return;
          editId=item.id;
          headline.value=item.headline || '';
          imageInput.value=item.image || '';
          imageFileInput.value='';
          article.value=item.article || '';
          formTitle.textContent='Edit berita';
        };
      });

      document.querySelectorAll('[data-d]').forEach(button=>{
        button.onclick=()=>{
          if(confirm('Hapus berita ini?')){
            news=news.filter(item=>item.id!==button.dataset.d);
            save('Hapus berita');
          }
        };
      });
    }

    async function save(message){
      msg.className='';
      msg.textContent='Menyimpan berita…';

      const response=await fetch(api,{
        method:'PUT',
        headers:{...head(),'Content-Type':'application/json'},
        body:JSON.stringify({message,content:encodeJson(news),sha,branch:BRANCH})
      });

      if(!response.ok){
        const error=await response.json().catch(()=>({}));
        msg.className='err';
        msg.textContent='Gagal menyimpan: '+(error.message || 'HTTP '+response.status);
        return false;
      }

      const result=await response.json();
      sha=result.content.sha;
      msg.className='ok';
      msg.textContent='Berhasil. Cloudflare Pages sedang memperbarui homepage.';
      form.reset();
      editId=null;
      formTitle.textContent='Terbitkan berita';
      draw();
      return true;
    }

    function fileToBase64(file){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result).split(',')[1]);
        reader.onerror=()=>reject(new Error('File gambar tidak dapat dibaca.'));
        reader.readAsDataURL(file);
      });
    }

    async function uploadImage(file){
      const allowedTypes=['image/jpeg','image/png','image/webp','image/gif'];

      if(!allowedTypes.includes(file.type)){
        throw new Error('Gunakan gambar JPG, PNG, WebP, atau GIF.');
      }

      if(file.size>5*1024*1024){
        throw new Error('Ukuran gambar maksimal 5 MB.');
      }

      const ext=(file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const cleanHeadline=(headline.value.trim() || 'berita')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,'-')
        .replace(/^-+|-+$/g,'')
        .slice(0,55) || 'berita';
      const filename=Date.now()+'-'+cleanHeadline+'.'+ext;
      const filePath='assets/images/'+filename;
      const fileApi=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath.split('/').map(encodeURIComponent).join('/')}`;

      const response=await fetch(fileApi,{
        method:'PUT',
        headers:{...head(),'Content-Type':'application/json'},
        body:JSON.stringify({
          message:'Upload gambar berita: '+cleanHeadline,
          content:await fileToBase64(file),
          branch:BRANCH
        })
      });

      if(!response.ok){
        const error=await response.json().catch(()=>({}));
        throw new Error(error.message || 'HTTP '+response.status);
      }

      return filePath;
    }

    connect.onclick=async()=>{
      token=$('#token').value.trim();
      try{
        await load();
        login.classList.add('hide');
        app.classList.remove('hide');
      }catch(error){
        loginMsg.className='err';
        loginMsg.textContent=error.message;
      }
    };

    form.onsubmit=async event=>{
      event.preventDefault();

      try{
        const oldItem=news.find(item=>item.id===editId);
        let imageUrl=imageInput.value.trim();
        const selectedFile=imageFileInput.files[0];

        if(selectedFile){
          msg.className='';
          msg.textContent='Mengunggah gambar ke GitHub…';
          imageUrl=await uploadImage(selectedFile);
        }

        if(!imageUrl){
          imageUrl=oldItem?.image || DEFAULT_IMAGE;
        }

        const item={
          id:editId || Date.now()+'',
          headline:headline.value.trim(),
          image:imageUrl,
          article:article.value.trim(),
          publishedAt:oldItem?.publishedAt || new Date().toISOString()
        };

        news=editId
          ? news.map(entry=>entry.id===editId ? item : entry)
          : [item,...news];

        await save(editId ? 'Perbarui berita' : 'Terbitkan berita');
      }catch(error){
        msg.className='err';
        msg.textContent='Gagal upload gambar: '+error.message;
      }
    };

    cancel.onclick=()=>{
      form.reset();
      editId=null;
