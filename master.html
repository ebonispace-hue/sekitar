<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard - Portal Berita</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-gray-100 font-sans flex min-h-screen">

    <!-- Sidebar Dashboard -->
    <aside class="w-64 bg-zinc-900 border-r border-zinc-800 p-6 hidden md:block">
        <div class="text-xl font-serif font-bold tracking-widest text-amber-500 mb-8">LUXE MASTER</div>
        <nav class="space-y-2">
            <a href="#" class="block bg-amber-500 text-zinc-950 font-medium px-4 py-2.5 rounded-lg">Tambah Berita</a>
            <a href="index.html" class="block text-gray-400 hover:text-white px-4 py-2.5 rounded-lg transition">Lihat Situs</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 md:p-12">
        <header class="mb-8">
            <h1 class="text-3xl font-serif font-bold">Dashboard Update Berita</h1>
            <p class="text-gray-400 text-sm">Unggah dan naikkan berita utama Anda ke halaman depan.</p>
        </header>

        <!-- Form Tambah Berita -->
        <section class="max-w-2xl bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
            <form id="news-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Judul Berita</label>
                    <input type="text" id="news-title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-gray-100 focus:outline-none focus:border-amber-500 transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Kategori</label>
                    <select id="news-category" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-gray-100 focus:outline-none focus:border-amber-500 transition">
                        <option value="Politik">Politik</option>
                        <option value="Bisnis">Bisnis</option>
                        <option value="Gaya Hidup">Gaya Hidup</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Isi Singkat Berita</label>
                    <textarea id="news-content" rows="4" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-gray-100 focus:outline-none focus:border-amber-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3 rounded-lg transition tracking-wide uppercase text-sm">
                    Terbitkan & Naikkan Berita
                </button>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('news-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('news-title').value;
            const category = document.getElementById('news-category').value;
            const content = document.getElementById('news-content').value;

            // Simulasi penyimpanan data menggunakan localStorage
            const currentNews = JSON.parse(localStorage.getItem('portal_news')) || [];
            currentNews.push({ title, category, content });
            localStorage.setItem('portal_news', JSON.stringify(currentNews));

            alert('Berita berhasil dinaikkan ke halaman utama!');
            this.reset();
        });
    </script>
</body>
</html>
