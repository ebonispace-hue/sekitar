
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Kendali Update — Seputar Cileungsi</title>
    
    <!-- Favicon Resmi Seputar Cileungsi dari FlamingText -->
    <link rel="icon" type="image/png" href="https://flamingtext.com">
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } }
        }
    </script>
</head>
<body class="bg-[#FBFBFA] text-stone-900 font-sans antialiased flex min-h-screen">

    <!-- Side Workspace Menu Navigation -->
    <aside class="w-64 bg-stone-900 text-stone-200 p-8 hidden md:flex flex-col justify-between border-r border-stone-800">
        <div class="space-y-12">
            <div class="flex items-center justify-center h-12 p-1 border-b border-stone-800">
                <img src="https://flamingtext.com" alt="Control Logo" class="h-full object-contain filter brightness-0 invert">
            </div>
            <nav class="space-y-4 text-xs font-semibold uppercase tracking-wider">
                <a href="#" class="block text-amber-400 border-l-2 border-amber-500 pl-3">Tambah Berita</a>
                <a href="index.html" class="block text-stone-400 hover:text-white pl-3 transition-colors">Lihat Situs Utama</a>
            </nav>
        </div>
        <div class="text-[10px] text-stone-500 tracking-widest font-mono">CMS PANEL v1.2.0</div>
    </aside>

    <!-- Main Workspace Area Frame -->
    <main class="flex-1 p-8 md:p-16 max-w-4xl">
        <header class="mb-10 space-y-2">
            <h1 class="text-3xl font-serif font-bold tracking-wide text-stone-900">Pusat Distribusi Berita</h1>
            <p class="text-stone-500 text-sm font-light">Kelola konten informasi berkala untuk wilayah jangkauan Seputar Cileungsi.</p>
        </header>

        <!-- Form Element Component Block -->
        <section class="bg-white border border-stone-200 rounded-lg p-8 shadow-sm">
            <form id="news-form" class="space-y-6">
                <div>
                    <label class="block text-[11px] uppercase tracking-wider font-bold text-stone-700 mb-2">Judul Berita Cileungsi</label>
                    <input type="text" id="news-title" required class="w-full bg-[#FDFDFB] border border-stone-200 rounded-md px-4 py-3.5 text-stone-900 focus:outline-none focus:border-stone-900 transition-colors font-medium">
                </div>

                <div>
                    <label class="block text-[11px] uppercase tracking-wider font-bold text-stone-700 mb-2">Tautan URL Gambar Artikel</label>
                    <input type="url" id="news-image" placeholder="Contoh: https://unsplash.com..." required class="w-full bg-[#FDFDFB] border border-stone-200 rounded-md px-4 py-3.5 text-stone-900 focus:outline-none focus:border-stone-900 transition-colors placeholder:text-stone-300 text-sm">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[11px] uppercase tracking-wider font-bold text-stone-700 mb-2">Pilih Kategori Cakupan</label>
                        <select id="news-category" class="w-full bg-[#FDFDFB] border border-stone-200 rounded-md px-4 py-3.5 text-stone-900 focus:outline-none focus:border-stone-900 transition-colors font-medium text-sm">
                            <option value="Kabar Desa">Kabar Desa</option>
                            <option value="Ekonomi">Ekonomi</option>
                            <option value="Komunitas">Komunitas</option>
                            <option value="Event">Event</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase tracking-wider font-bold text-stone-700 mb-2">Tautan Artikel Tujuan (Saat Diklik)</label>
                        <input type="url" id="news-link" placeholder="https://..." class="w-full bg-[#FDFDFB] border border-stone-200 rounded-md px-4 py-3.5 text-stone-900 focus:outline-none focus:border-stone-900 transition-colors placeholder:text-stone-300 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] uppercase tracking-wider font-bold text-stone-700 mb-2">Deskripsi Ringkas Narasi Berita</label>
                    <textarea id="news-content" rows="5" required class="w-full bg-[#FDFDFB] border border-stone-200 rounded-md px-4 py-3.5 text-stone-900 focus:outline-none focus:border-stone-900 transition-colors font-light leading-relaxed"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-stone-900 hover:bg-amber-800 text-white font-semibold py-4 transition-colors tracking-[0.2em] uppercase text-xs rounded-md shadow">
                        Terbitkan & Naikkan Berita Utama Sekarang →
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('news-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('news-title').value;
            const imageUrl = document.getElementById('news-image').value;
            const category = document.getElementById('news-category').value;
            const articleLink = document.getElementById('news-link').value || '#';
            const content = document.getElementById('news-content').value;

            const currentNews = JSON.parse(localStorage.getItem('portal_news')) || [];
            currentNews.push({ title, imageUrl, category, articleLink, content });
            localStorage.setItem('portal_news', JSON.stringify(currentNews));

            alert('Berita Seputar Cileungsi berhasil ditambahkan!');
            this.reset();
        });
    </script>
</body>
</html>
