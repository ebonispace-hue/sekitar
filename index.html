<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cileungsi Sekitar</title><link rel="icon" href="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png"><style>:root{--bg:#070b16;--card:#0d172b;--line:#263a5a;--text:#eff6ff;--muted:#9aaac4;--cyan:#39e7ff}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(circle at 12% 0,#193d75,transparent 30%),#070b16}header{position:sticky;top:0;background:#070b16dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav,main{max-width:1120px;margin:auto;padding:0 22px}nav{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.brand img{width:38px;height:38px;object-fit:contain;border-radius:9px}.brand span,.cyan{color:var(--cyan)}.radius{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 12px}main{padding-top:55px;padding-bottom:70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:25px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-4px;margin:10px 0}.hero p{max-width:295px;color:var(--muted);line-height:1.55}.tag{font-size:12px;color:var(--cyan);font-weight:bold;letter-spacing:1.5px}.count{color:var(--muted);margin:35px 0 16px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-5px);border-color:var(--cyan)}.card button{padding:0;border:0;width:100%;text-align:left;background:transparent;color:inherit;cursor:pointer}.cover{height:205px;position:relative;overflow:hidden;background:#17243e}.cover img{width:100%;height:100%;object-fit:cover}.label{position:absolute;top:12px;left:12px;background:#07101ee0;border:1px solid #ffffff44;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:bold}.body{padding:18px}.body h2{font-size:20px;line-height:1.12;margin:0 0 12px}.excerpt{color:#b5c3d9;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.url{border-top:1px solid var(--line);padding-top:11px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;z-index:3;display:none;padding:24px;overflow:auto;background:#020611cc;backdrop-filter:blur(8px)}.modal.open{display:block}.article{position:relative;max-width:820px;margin:20px auto;background:#0c1528;border:1px solid var(--line);border-radius:18px;overflow:hidden}.article>img{width:100%;height:340px;object-fit:cover}.close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid #fff6;background:#06101edd;color:white;font-size:22px}.articleBody{padding:32px}.articleBody h2{font-size:clamp(29px,5vw,49px);line-height:1.05;margin:9px 0 24px}.full{white-space:pre-wrap;line-height:1.8;color:#d8e2ef}@media(max-width:720px){nav,main{padding-left:16px;padding-right:16px}.radius{display:none}main{padding-top:35px}.hero{display:block}.hero h1{letter-spacing:-2.5px}.grid{grid-template-columns:1fr}.cover{height:220px}.article>img{height:230px}}</style></head><body><header><nav><div class="brand"><img src="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png">CILEUNGSI <span>SEKITAR</span></div><div class="radius">● Berita radius ±10 km</div></nav></header><main><section class="hero"><div><div class="tag">PORTAL BERITA HYPERLOCAL</div><h1>Yang dekat,<br><span class="cyan">yang berarti.</span></h1></div><p>Kabar dan cerita dari Cileungsi serta kawasan sekitarnya. Klik berita untuk membaca artikel lengkap.</p></section><div id="count" class="count">Memuat berita…</div><section id="grid" class="grid"></section></main><div id="modal" class="modal"><article class="article"><button id="close" class="close">×</button><img id="photo"><div class="articleBody"><div class="tag">CILEUNGSI SEKITAR • ARTIKEL</div><h2 id="title"></h2><div id="text" class="full"></div></div></article></div><script>let news=[];const q=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function start(){try{news=await(await fetch('berita.json?'+Date.now())).json()}catch(e){news=[]}q('#count').textContent=news.length+' berita terbit • pembaruan lokal';q('#grid').innerHTML=news.map(n=>`<article class="card"><button data-id="${esc(n.id)}"><div class="cover"><img src="${esc(n.image)}" alt="${esc(n.headline)}"><span class="label">BERITA LOKAL</span></div><div class="body"><h2>${esc(n.headline)}</h2><p class="excerpt">${esc(n.article)}</p><div class="url">URL GAMBAR: ${esc(n.image)}</div></div></button></article>`).join('')||'<p>Belum ada berita.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}function open(id){let n=news.find(x=>x.id===id);q('#photo').src=n.image;q('#title').textContent=n.headline;q('#text').textContent=n.article;q('#modal').classList.add('open')}q('#close').onclick=()=>q('#modal').classList.remove('open');q('#modal').onclick=e=>{if(e.target===q('#modal'))q('#modal').classList.remove('open')};start()</script></body></html>
