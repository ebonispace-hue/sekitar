  <style>
    :root{--bg:#070b16;--card:#0d172b;--line:#263a5a;--text:#eff6ff;--muted:#9aaac4;--cyan:#39e7ff;--error:#ff7b7b}
    *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(circle at 12% 0,#193d75,transparent 30%),#070b16}
    header{position:sticky;top:0;z-index:2;background:#070b16dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)} nav,main{max-width:1120px;margin:auto;padding:0 22px}
    nav{height:92px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px;font-weight:900;font-size:22px;text-decoration:none;color:inherit}.brand img{width:64px!important;height:64px!important;display:block;object-fit:contain;border-radius:12px;flex:0 0 64px}.brand span,.cyan{color:var(--cyan)}.radius{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 12px}
    main{padding-top:55px;padding-bottom:70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:25px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-4px;margin:10px 0}.hero p{max-width:295px;color:var(--muted);line-height:1.55}.tag{font-size:12px;color:var(--cyan);font-weight:bold;letter-spacing:1.5px}
    .status{margin-top:22px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px;line-height:1.5}.status.error{border-color:#7d3434;color:var(--error)}.status.ok{border-color:#216a75;color:#a9f5ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-5px);border-color:var(--cyan)}.card a{display:block;color:inherit;text-decoration:none}.cover{height:205px;position:relative;overflow:hidden;background:#17243e}.cover img{width:100%;height:100%;object-fit:cover}.label{position:absolute;top:12px;left:12px;background:#07101ee0;border:1px solid #ffffff44;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:bold}.body{padding:18px}.body h2{font-size:20px;line-height:1.12;margin:0 0 12px}.excerpt{color:#b5c3d9;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.url{border-top:1px solid var(--line);padding-top:11px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>
  <header><nav aria-label="Navigasi utama"><a class="brand" href="https://www.infocileungsi.web.id/" aria-label="Beranda Cileungsi Sekitar"><img src="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png" alt="Logo Cileungsi Sekitar" width="64" height="64">CILEUNGSI <span>SEKITAR</span></a><div class="radius">● Berita Akurat &amp; Tepat</div></nav></header>
  <main>
    <section class="hero" aria-labelledby="main-title"><div><div class="tag">PORTAL BERITA HYPERLOCAL</div><h1 id="main-title">Yang dekat,<br><span class="cyan">yang berarti.</span></h1></div><p>Kabar dan cerita dari Cileungsi serta kawasan sekitarnya. Klik berita untuk membaca artikel lengkap.</p></section>
    <div id="status" class="status">Memuat berita dari berita.json…</div>
    <section id="grid" class="grid" aria-label="Daftar berita terbaru"></section>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="title" aria-hidden="true"><article class="article"><button id="close" class="close" type="button" aria-label="Tutup artikel">×</button><img id="photo" src="" alt="" width="820" height="340"><div class="articleBody"><div class="tag">CILEUNGSI SEKITAR • ARTIKEL</div><h1 id="title"></h1><p id="article-meta" class="articleMeta"></p><div id="text" class="full"></div><div id="tags" class="tags" aria-label="Tag artikel"></div></div></article></div>

  <script>
    const SITE_URL = 'https://www.infocileungsi.web.id/';
    const SITE_NAME = 'Cileungsi Sekitar';
    const DEFAULT_TITLE = 'Cileungsi Sekitar | Berita Lokal Cileungsi dan Sekitarnya';
    const DEFAULT_DESCRIPTION = 'Portal berita hyperlocal Cileungsi. Baca kabar, cerita, informasi, dan peristiwa terbaru dari Cileungsi serta kawasan sekitarnya.';
    const DEFAULT_IMAGE = 'https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png';
    let news = []; let previouslyFocused = null;
    const q = selector => document.querySelector(selector);
    const esc = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const cleanText = value => String(value || '').replace(/\s+/g, ' ').trim();
    const descriptionFrom = article => { const text = cleanText(article); return text.length > 155 ? `${text.slice(0,152)}...` : text; };
    const articleUrl = id => `${SITE_URL}?artikel=${encodeURIComponent(id)}`;
    function setStatus(message, type = '') { const el = q('#status'); el.textContent = message; el.className = `status ${type}`.trim(); }
    function setMeta(selector, content) { const element = q(selector); if (element) element.setAttribute('content', content); }
    function toIsoDate(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? null : date.toISOString(); }
    function displayDate(value) { const iso = toIsoDate(value); return iso ? new Intl.DateTimeFormat('id-ID',{dateStyle:'long',timeZone:'Asia/Jakarta'}).format(new Date(iso)) : ''; }
    function setSeoHome() { document.title=DEFAULT_TITLE; q('#canonical').href=SITE_URL; setMeta('#og-type','website'); setMeta('meta[name="description"]',DEFAULT_DESCRIPTION); setMeta('#og-title',DEFAULT_TITLE); setMeta('#og-description',DEFAULT_DESCRIPTION); setMeta('#og-url',SITE_URL); setMeta('#og-image',DEFAULT_IMAGE); setMeta('#twitter-title',DEFAULT_TITLE); setMeta('#twitter-description',DEFAULT_DESCRIPTION); setMeta('#twitter-image',DEFAULT_IMAGE); q('#article-schema').textContent='{}'; }
    function setSeoArticle(n) { const title=`${cleanText(n.headline)} | ${SITE_NAME}`, description=descriptionFrom(n.article)||DEFAULT_DESCRIPTION, url=articleUrl(n.id), image=n.image||DEFAULT_IMAGE, published=toIsoDate(n.publishedAt)||new Date().toISOString(), modified=toIsoDate(n.modifiedAt)||published; document.title=title; q('#canonical').href=url; setMeta('#og-type','article'); setMeta('meta[name="description"]',description); setMeta('#og-title',title); setMeta('#og-description',description); setMeta('#og-url',url); setMeta('#og-image',image); setMeta('#twitter-title',title); setMeta('#twitter-description',description); setMeta('#twitter-image',image); q('#article-schema').textContent=JSON.stringify({'@context':'https://schema.org','@type':'NewsArticle',mainEntityOfPage:{'@type':'WebPage','@id':url},headline:cleanText(n.headline),description,image:[image],datePublished:published,dateModified:modified,author:{'@type':'Organization',name:SITE_NAME,url:SITE_URL},publisher:{'@type':'Organization',name:SITE_NAME,logo:{'@type':'ImageObject',url:DEFAULT_IMAGE}},inLanguage:'id-ID'}); }
    function linkify(text) { const escaped=esc(text); return escaped.replace(/(https?:\/\/[^\s<]+)/g,url=>{const safeUrl=url.replace(/[.,!?;:]+$/,'');return `<a href="${safeUrl}" target="_blank" rel="noopener">${safeUrl}</a>${url.slice(safeUrl.length)}`;}); }
    function renderTags(tags) { q('#tags').innerHTML=(Array.isArray(tags)?tags:[]).filter(tag=>String(tag||'').trim()).map(tag=>`<span class="tagItem">#${esc(tag)}</span>`).join(''); }
    function renderGrid() { q('#grid').innerHTML=news.map(n=>{const id=esc(n.id),headline=esc(n.headline),image=esc(n.image||DEFAULT_IMAGE),excerpt=esc(descriptionFrom(n.article)),href=esc(articleUrl(n.id));return `<article class="card"><a href="${href}" data-id="${id}" aria-label="Baca artikel: ${headline}"><div class="cover"><img src="${image}" alt="${headline}" width="360" height="205" loading="lazy" decoding="async"><span class="label">BERITA LOKAL</span></div><div class="body"><h2>${headline}</h2><p class="excerpt">${excerpt}</p><div class="url">CILEUNGSI SEKITAR • BACA ARTIKEL</div></div></a></article>`;}).join(''); document.querySelectorAll('[data-id]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();open(link.dataset.id,true);})); }
    async function start() { try { const response = await fetch('berita.json?ts=' + Date.now(), { cache: 'no-store' }); const raw = await response.text(); if (!response.ok) throw new Error(`berita.json mengembalikan HTTP ${response.status}`); try { news = JSON.parse(raw); } catch { throw new Error('berita.json bukan JSON valid. Awal isi file: ' + raw.slice(0,120)); } if (!Array.isArray(news)) throw new Error('Format berita.json harus berupa array JSON, dimulai dengan karakter [.'); if (!news.length) throw new Error('berita.json berhasil dibaca tetapi daftar beritanya kosong.'); setStatus(`✓ ${news.length} berita berhasil dimuat dari berita.json.`, 'ok'); renderGrid(); openFromUrl(); } catch (error) { q('#grid').innerHTML = ''; setStatus(`Gagal memuat berita: ${error.message}`, 'error'); console.error('Gagal memuat berita.json:', error); } }
    function open(id, updateUrl) { const n=news.find(item=>String(item.id)===String(id)); if(!n){setSeoHome();return;} previouslyFocused=document.activeElement; q('#photo').src=n.image||DEFAULT_IMAGE; q('#photo').alt=n.headline||'Gambar berita Cileungsi Sekitar'; q('#title').textContent=n.headline||''; q('#article-meta').textContent=displayDate(n.publishedAt)?`Diterbitkan ${displayDate(n.publishedAt)}`:''; q('#text').innerHTML=linkify(n.article||''); renderTags(n.tags); q('#modal').classList.add('open'); q('#modal').setAttribute('aria-hidden','false'); setSeoArticle(n); if(updateUrl)history.pushState({article:n.id},'',articleUrl(n.id)); q('#close').focus(); }
    function closeModal(resetUrl) { q('#modal').classList.remove('open'); q('#modal').setAttribute('aria-hidden','true'); if(resetUrl)history.pushState({},'',SITE_URL); setSeoHome(); if(previouslyFocused)previouslyFocused.focus(); }
    function openFromUrl() { const id=new URLSearchParams(location.search).get('artikel'); if(id)open(id,false); else closeModal(false); }
    q('#close').addEventListener('click',()=>closeModal(true)); q('#modal').addEventListener('click',event=>{if(event.target===q('#modal'))closeModal(true);}); document.addEventListener('keydown',event=>{if(event.key==='Escape'&&q('#modal').classList.contains('open'))closeModal(true);}); window.addEventListener('popstate',openFromUrl);
    setSeoHome(); start();
  </script>
