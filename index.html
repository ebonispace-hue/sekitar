<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cileungsi Sekitar | Berita Lokal Cileungsi dan Sekitarnya</title>
  <meta name="description" content="Portal berita hyperlocal Cileungsi. Baca kabar, cerita, informasi, dan peristiwa terbaru dari Cileungsi serta kawasan sekitarnya.">
  <meta name="robots" content="index,follow,max-snippet:-1,max-video-preview:-1,max-image-preview:large">
  <link id="canonical" rel="canonical" href="https://ebonispace-hue.github.io/sekitar/">

  <meta property="og:locale" content="id_ID">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cileungsi Sekitar">
  <meta id="og-title" property="og:title" content="Cileungsi Sekitar | Berita Lokal Cileungsi dan Sekitarnya">
  <meta id="og-description" property="og:description" content="Kabar dan cerita dari Cileungsi serta kawasan sekitarnya.">
  <meta id="og-url" property="og:url" content="https://ebonispace-hue.github.io/sekitar/">
  <meta id="og-image" property="og:image" content="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta id="twitter-title" name="twitter:title" content="Cileungsi Sekitar | Berita Lokal">
  <meta id="twitter-description" name="twitter:description" content="Kabar dan cerita dari Cileungsi serta kawasan sekitarnya.">
  <meta id="twitter-image" name="twitter:image" content="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png">

  <link rel="icon" href="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png">

  <script type="application/ld+json" id="website-schema">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Cileungsi Sekitar",
    "url": "https://ebonispace-hue.github.io/sekitar/",
    "inLanguage": "id-ID",
    "description": "Portal berita hyperlocal Cileungsi dan kawasan sekitarnya."
  }
  </script>

  <script type="application/ld+json" id="organization-schema">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Cileungsi Sekitar",
    "url": "https://ebonispace-hue.github.io/sekitar/",
    "logo": "https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png"
  }
  </script>

  <script type="application/ld+json" id="article-schema">{}</script>

  <style>
    :root{--bg:#070b16;--card:#0d172b;--line:#263a5a;--text:#eff6ff;--muted:#9aaac4;--cyan:#39e7ff}
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(circle at 12% 0,#193d75,transparent 30%),#070b16}
    header{position:sticky;top:0;background:#070b16dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    nav,main{max-width:1120px;margin:auto;padding:0 22px}
    nav{height:74px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
    .brand img{width:38px;height:38px;object-fit:contain;border-radius:9px}
    .brand span,.cyan{color:var(--cyan)}
    .radius{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 12px}
    main{padding-top:55px;padding-bottom:70px}
    .hero{display:flex;justify-content:space-between;align-items:end;gap:25px}
    .hero h1{font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-4px;margin:10px 0}
    .hero p{max-width:295px;color:var(--muted);line-height:1.55}
    .tag{font-size:12px;color:var(--cyan);font-weight:bold;letter-spacing:1.5px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:35px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s}
    .card:hover{transform:translateY(-5px);border-color:var(--cyan)}
    .card a{display:block;color:inherit;text-decoration:none}
    .cover{height:205px;position:relative;overflow:hidden;background:#17243e}
    .cover img{width:100%;height:100%;object-fit:cover}
    .label{position:absolute;top:12px;left:12px;background:#07101ee0;border:1px solid #ffffff44;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:bold}
    .body{padding:18px}
    .body h2{font-size:20px;line-height:1.12;margin:0 0 12px}
    .excerpt{color:#b5c3d9;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .url{border-top:1px solid var(--line);padding-top:11px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .modal{position:fixed;inset:0;z-index:3;display:none;padding:24px;overflow:auto;background:#020611cc;backdrop-filter:blur(8px)}
    .modal.open{display:block}
    .article{position:relative;max-width:820px;margin:20px auto;background:#0c1528;border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .article>img{width:100%;height:340px;object-fit:cover}
    .close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid #fff6;background:#06101edd;color:white;font-size:22px;cursor:pointer}
    .articleBody{padding:32px}
    .articleBody h2{font-size:clamp(29px,5vw,49px);line-height:1.05;margin:9px 0 24px}
    .full{white-space:pre-wrap;line-height:1.8;color:#d8e2ef}
    .full a{color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
    .tagItem{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:7px 10px;color:var(--cyan);font-size:12px;line-height:1}
    @media(max-width:720px){nav,main{padding-left:16px;padding-right:16px}.radius{display:none}main{padding-top:35px}.hero{display:block}.hero h1{letter-spacing:-2.5px}.grid{grid-template-columns:1fr}.cover{height:220px}.article>img{height:230px}}
  </style>
</head>
<body>
  <header>
    <nav aria-label="Navigasi utama">
      <div class="brand">
        <img src="https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png" alt="Logo Cileungsi Sekitar" width="38" height="38">
        CILEUNGSI <span>SEKITAR</span>
      </div>
      <div class="radius">● Berita Akurat & Tepat</div>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="main-title">
      <div>
        <div class="tag">PORTAL BERITA HYPERLOCAL</div>
        <h1 id="main-title">Yang dekat,<br><span class="cyan">yang berarti.</span></h1>
      </div>
      <p>Kabar dan cerita dari Cileungsi serta kawasan sekitarnya. Klik berita untuk membaca artikel lengkap.</p>
    </section>

    <section id="grid" class="grid" aria-label="Daftar berita terbaru"></section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="title" aria-hidden="true">
    <article class="article">
      <button id="close" class="close" type="button" aria-label="Tutup artikel">×</button>
      <img id="photo" src="" alt="" width="820" height="340">
      <div class="articleBody">
        <div class="tag">CILEUNGSI SEKITAR • ARTIKEL</div>
        <h2 id="title"></h2>
        <div id="text" class="full"></div>
        <div id="tags" class="tags" aria-label="Tag artikel"></div>
      </div>
    </article>
  </div>

  <script>
    const SITE_URL = 'https://ebonispace-hue.github.io/sekitar/';
    const SITE_NAME = 'Cileungsi Sekitar';
    const DEFAULT_TITLE = 'Cileungsi Sekitar | Berita Lokal Cileungsi dan Sekitarnya';
    const DEFAULT_DESCRIPTION = 'Portal berita hyperlocal Cileungsi. Baca kabar, cerita, informasi, dan peristiwa terbaru dari Cileungsi serta kawasan sekitarnya.';
    const DEFAULT_IMAGE = 'https://cdn.phototourl.com/free/2026-08-11-265895a0-1677-4fbf-9f9c-e7e7b550d54c.png';

    let news = [];
    let previouslyFocused = null;

    const q = selector => document.querySelector(selector);

    const esc = value => String(value || '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));

    const cleanText = value => String(value || '').replace(/\s+/g, ' ').trim();

    const descriptionFrom = article => {
      const text = cleanText(article);
      return text.length > 155 ? `${text.slice(0, 152)}...` : text;
    };

    const articleUrl = id => `${SITE_URL}#artikel=${encodeURIComponent(id)}`;

    function setMeta(selector, content) {
      const element = q(selector);
      if (element) element.setAttribute('content', content);
    }

    function setSeoHome() {
      document.title = DEFAULT_TITLE;
      q('#canonical').href = SITE_URL;
      setMeta('meta[name="description"]', DEFAULT_DESCRIPTION);
      setMeta('#og-title', DEFAULT_TITLE);
      setMeta('#og-description', DEFAULT_DESCRIPTION);
      setMeta('#og-url', SITE_URL);
      setMeta('#og-image', DEFAULT_IMAGE);
      setMeta('#twitter-title', DEFAULT_TITLE);
      setMeta('#twitter-description', DEFAULT_DESCRIPTION);
      setMeta('#twitter-image', DEFAULT_IMAGE);
      q('#article-schema').textContent = '{}';
    }

    function setSeoArticle(n) {
      const title = `${cleanText(n.headline)} | ${SITE_NAME}`;
      const description = descriptionFrom(n.article) || DEFAULT_DESCRIPTION;
      const url = articleUrl(n.id);
      const image = n.image || DEFAULT_IMAGE;

      document.title = title;
      q('#canonical').href = url;
      setMeta('meta[name="description"]', description);
      setMeta('#og-title', title);
      setMeta('#og-description', description);
      setMeta('#og-url', url);
      setMeta('#og-image', image);
      setMeta('#twitter-title', title);
      setMeta('#twitter-description', description);
      setMeta('#twitter-image', image);

      q('#article-schema').textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'NewsArticle',
        mainEntityOfPage: {'@type': 'WebPage', '@id': url},
        headline: cleanText(n.headline),
        description,
        image: [image],
        datePublished: n.publishedAt || new Date().toISOString(),
        dateModified: n.modifiedAt || n.publishedAt || new Date().toISOString(),
        author: {'@type': 'Organization', name: SITE_NAME, url: SITE_URL},
        publisher: {
          '@type': 'Organization',
          name: SITE_NAME,
          logo: {'@type': 'ImageObject', url: DEFAULT_IMAGE}
        },
        inLanguage: 'id-ID'
      });
    }

    function linkify(text) {
      const escaped = esc(text);
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, url => {
        const safeUrl = url.replace(/[.,!?;:]+$/, '');
        const trailing = url.slice(safeUrl.length);
        return `<a href="${safeUrl}" target="_blank" rel="noopener">${safeUrl}</a>${trailing}`;
      });
    }

    function renderTags(tags) {
      const validTags = Array.isArray(tags) ? tags : [];
      q('#tags').innerHTML = validTags
        .filter(tag => String(tag || '').trim())
        .map(tag => `<span class="tagItem">#${esc(tag)}</span>`)
        .join('');
    }

    function renderGrid() {
      q('#grid').innerHTML = news.map(n => {
        const id = esc(n.id);
        const headline = esc(n.headline);
        const image = esc(n.image || DEFAULT_IMAGE);
        const excerpt = esc(descriptionFrom(n.article));

        return `<article class="card">
          <a href="#artikel=${encodeURIComponent(n.id)}" data-id="${id}" aria-label="Baca artikel: ${headline}">
            <div class="cover">
              <img src="${image}" alt="${headline}" width="360" height="205" loading="lazy" decoding="async">
              <span class="label">BERITA LOKAL</span>
            </div>
            <div class="body">
              <h2>${headline}</h2>
              <p class="excerpt">${excerpt}</p>
              <div class="url">CILEUNGSI SEKITAR • BACA ARTIKEL</div>
            </div>
          </a>
        </article>`;
      }).join('') || '<p>Belum ada berita.</p>';

      document.querySelectorAll('[data-id]').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          open(link.dataset.id, true);
        });
      });
    }

    async function start() {
      try {
        const response = await fetch('berita.json', {cache: 'no-cache'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        news = await response.json();
        if (!Array.isArray(news)) throw new Error('Format berita.json harus array.');
      } catch (error) {
        news = [];
      }

      renderGrid();
      openFromHash();
    }

    function open(id, updateHash) {
      const n = news.find(item => String(item.id) === String(id));
      if (!n) return;

      previouslyFocused = document.activeElement;
      q('#photo').src = n.image || DEFAULT_IMAGE;
      q('#photo').alt = n.headline || 'Gambar berita Cileungsi Sekitar';
      q('#title').textContent = n.headline || '';
      q('#text').innerHTML = linkify(n.article || '');
      renderTags(n.tags);
      q('#modal').classList.add('open');
      q('#modal').setAttribute('aria-hidden', 'false');
      setSeoArticle(n);

      if (updateHash) history.pushState({article: n.id}, '', `#artikel=${encodeURIComponent(n.id)}`);
      q('#close').focus();
    }

    function closeModal(resetUrl) {
      q('#modal').classList.remove('open');
      q('#modal').setAttribute('aria-hidden', 'true');
      if (resetUrl) history.pushState({}, '', SITE_URL);
      setSeoHome();
      if (previouslyFocused) previouslyFocused.focus();
    }

    function openFromHash() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      if (params.has('artikel')) open(params.get('artikel'), false);
      else closeModal(false);
    }

    q('#close').addEventListener('click', () => closeModal(true));

    q('#modal').addEventListener('click', event => {
      if (event.target === q('#modal')) closeModal(true);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && q('#modal').classList.contains('open')) closeModal(true);
    });

    window.addEventListener('hashchange', openFromHash);

    setSeoHome();
    start();
  </script>
</body>
</html>
